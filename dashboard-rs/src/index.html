<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shadow-Core Sentinel</title>
<style>
  :root {
    --bg:#0b0c0e; --surface:#131518; --surface-2:#191c20;
    --line:#24282e; --text:#e8eaed; --muted:#9aa3ad; --dim:#6b747e;
    --accent:#35b981; --warn:#e8b50c; --bad:#e05c5c;
    --mono:'Cascadia Mono','JetBrains Mono',Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
    font-size:14px; line-height:1.5;
  }
  header {
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:14px 20px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  h1 { font-size:15px; margin:0; letter-spacing:-0.01em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:12px; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .dot.ok { background:var(--accent); } .dot.bad { background:var(--bad); }

  main { padding:20px; max-width:1400px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .n { font-size:22px; font-weight:600; font-family:var(--mono); }
  .card .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.07em; }

  .bar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  select, button {
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font-size:13px; font-family:inherit;
  }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }

  table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; }
  th {
    text-align:left; padding:7px 10px; color:var(--dim); font-weight:600;
    border-bottom:1px solid var(--line); text-transform:uppercase;
    font-size:10px; letter-spacing:0.07em; position:sticky; top:0; background:var(--bg);
  }
  td { padding:6px 10px; border-bottom:1px solid #1a1d21; vertical-align:top; }
  tr:hover td { background:var(--surface); }
  .path { word-break:break-all; color:var(--text); }
  .hash { color:var(--dim); }
  .k { font-weight:600; padding:1px 6px; border-radius:3px; font-size:11px; }
  .k.created  { color:var(--accent);  background:rgba(53,185,129,.12); }
  .k.modified { color:var(--warn);    background:rgba(232,181,12,.12); }
  .k.deleted  { color:var(--bad);     background:rgba(224,92,92,.12); }
  .k.moved    { color:#7aa7ff;        background:rgba(122,167,255,.12); }
  .empty { color:var(--dim); padding:26px; text-align:center; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.07em; color:var(--dim); margin:22px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Shadow-Core <span>Sentinel</span></h1>
  <span class="sub">filesystem audit trail &middot; read-only</span>
  <span id="status"><span class="dot bad"></span>connecting…</span>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="bar">
    <label for="project" class="sub">Project</label>
    <select id="project"></select>
    <label for="limit" class="sub">Rows</label>
    <select id="limit">
      <option>100</option><option selected>200</option>
      <option>1000</option><option>5000</option>
    </select>
    <button id="refresh">Refresh</button>
    <span class="sub" id="meta"></span>
  </div>

  <h2>Events</h2>
  <div class="wrap"><table>
    <thead><tr><th>Time</th><th>Kind</th><th>Path</th><th>SHA-256</th></tr></thead>
    <tbody id="events"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
  </table></div>

  <h2>Snapshots</h2>
  <div class="wrap"><table>
    <thead><tr><th>Taken</th><th>Label</th><th>Size</th></tr></thead>
    <tbody id="snaps"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
  </table></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function setStatus(ok, text) {
  $('status').innerHTML = `<span class="dot ${ok ? 'ok' : 'bad'}"></span>${esc(text)}`;
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

// The stored timestamp is whatever Python's .isoformat() produced. Show it as
// local time where parseable, but never hide the original if it is not.
function fmtTime(ts) {
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString();
}

async function loadProjects() {
  const projects = await jget('/api/projects');
  const sel = $('project');
  const previous = sel.value;
  sel.innerHTML = projects.map(p => {
    // events === -1 means the file is present but unreadable. Saying "0 events"
    // there would report a broken database as an idle one.
    const n = p.events < 0 ? 'unreadable' : `${p.events.toLocaleString()} events`;
    return `<option value="${esc(p.name)}">${esc(p.name)} — ${n}</option>`;
  }).join('');
  if (previous) sel.value = previous;
  return projects;
}

async function loadCards(projects) {
  const s = await jget('/api/stats');
  const totalSnaps = projects.reduce((a, p) => a + p.snapshots, 0);
  const broken = projects.filter(p => p.events < 0).length;
  $('cards').innerHTML = `
    <div class="card"><div class="n">${s.total_events.toLocaleString()}</div><div class="l">Events recorded</div></div>
    <div class="card"><div class="n">${s.projects}</div><div class="l">Projects watched</div></div>
    <div class="card"><div class="n">${totalSnaps}</div><div class="l">Snapshots</div></div>
    <div class="card"><div class="n" style="color:${broken ? 'var(--bad)' : 'var(--accent)'}">${broken}</div><div class="l">Unreadable</div></div>`;
}

async function loadEvents() {
  const project = $('project').value;
  const limit = $('limit').value;
  const tb = $('events');
  try {
    const d = await jget(`/api/events?project=${encodeURIComponent(project)}&limit=${limit}`);
    $('meta').textContent = `${d.count} shown`;
    tb.innerHTML = d.events.length ? d.events.map(e => {
      const path = e.dest_path ? `${esc(e.src_path)} → ${esc(e.dest_path)}` : esc(e.src_path);
      const kind = esc(e.kind).toLowerCase();
      return `<tr>
        <td>${esc(fmtTime(e.ts))}</td>
        <td><span class="k ${kind}">${esc(e.kind)}</span></td>
        <td class="path">${path}</td>
        <td class="hash">${e.sha256 ? esc(e.sha256).slice(0, 12) : '—'}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" class="empty">No events recorded for this project.</td></tr>';
  } catch (err) {
    tb.innerHTML = `<tr><td colspan="4" class="empty">Could not load events: ${esc(err.message)}</td></tr>`;
  }
}

async function loadSnaps() {
  const project = $('project').value;
  const tb = $('snaps');
  try {
    const d = await jget(`/api/snapshots?project=${encodeURIComponent(project)}`);
    tb.innerHTML = d.snapshots.length ? d.snapshots.map(s => `<tr>
        <td>${esc(fmtTime(s.taken))}</td>
        <td>${esc(s.label) || '<span class="hash">(no label)</span>'}</td>
        <td class="hash">${fmtBytes(s.bytes)}</td>
      </tr>`).join('') : '<tr><td colspan="3" class="empty">No snapshots taken.</td></tr>';
  } catch (err) {
    tb.innerHTML = `<tr><td colspan="3" class="empty">Could not load snapshots: ${esc(err.message)}</td></tr>`;
  }
}

async function refresh() {
  try {
    const h = await jget('/health');
    setStatus(true, `${h.databases_readable}/${h.databases_found} databases readable`);
    const projects = await loadProjects();
    await loadCards(projects);
    await Promise.all([loadEvents(), loadSnaps()]);
  } catch (err) {
    setStatus(false, 'dashboard unreachable');
  }
}

$('refresh').addEventListener('click', refresh);
$('project').addEventListener('change', () => { loadEvents(); loadSnaps(); });
$('limit').addEventListener('change', loadEvents);
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
